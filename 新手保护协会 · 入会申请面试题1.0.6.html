<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新手保护协会 · 入会申请面试</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #e8fff7 0%, #f4fbff 45%, #fff8e8 100%);
    color: #17352c;
  }

  body { position: relative; overflow-x: hidden; }

  .watermark {
    position: fixed;
    left: -50%;
    top: -50%;
    width: 200%;
    height: 200%;
    z-index: 0;
    pointer-events: none;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 70px 110px;
    padding: 40px;
    transform: rotate(-45deg);
    opacity: 0.065;
    color: #07835f;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 2px;
    user-select: none;
    white-space: nowrap;
  }

  .app {
    position: relative;
    z-index: 1;
    width: min(980px, calc(100% - 28px));
    margin: 0 auto;
    padding: 26px 0 60px;
  }

  .brand { text-align: center; margin-bottom: 18px; }
  .brand h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 38px);
    color: #075c45;
    letter-spacing: 1px;
    text-shadow: 0 2px 0 rgba(255,255,255,.8);
  }
  .brand p { margin: 8px 0 0; color: #4f7468; font-size: 14px; }

  .card {
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(7, 131, 95, .18);
    border-radius: 20px;
    box-shadow: 0 18px 45px rgba(18, 78, 61, .12);
    padding: 24px;
    backdrop-filter: blur(4px);
  }

  .hidden { display: none !important; }

  .start-box {
    max-width: 560px;
    margin: 34px auto 0;
    text-align: center;
  }
  .start-box h2 { margin: 0 0 10px; color: #075c45; }
  .start-box .tip {
    color: #5c7b70;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 20px;
  }
  .nickname-input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #bde6d7;
    border-radius: 14px;
    outline: none;
    font-size: 16px;
    text-align: center;
    background: #fbfffd;
    transition: border-color .2s, box-shadow .2s;
  }
  .nickname-input:focus {
    border-color: #0aa574;
    box-shadow: 0 0 0 4px rgba(10, 165, 116, .12);
  }

  .btn {
    border: none;
    cursor: pointer;
    border-radius: 14px;
    padding: 13px 22px;
    font-size: 16px;
    font-weight: 700;
    transition: transform .15s, box-shadow .15s, opacity .15s;
    font-family: inherit;
  }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-primary {
    margin-top: 16px;
    width: 100%;
    color: #fff;
    background: linear-gradient(135deg, #08a572, #067a57);
    box-shadow: 0 10px 22px rgba(8, 165, 114, .26);
  }
  .btn-primary:hover { box-shadow: 0 14px 26px rgba(8, 165, 114, .34); }

  .btn-secondary {
    color: #075c45;
    background: #e9fff7;
    border: 1px solid #bde6d7;
  }

  .quiz-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    padding: 14px 18px;
    border-radius: 16px;
    background: rgba(255,255,255,.86);
    border: 1px solid rgba(7,131,95,.14);
  }
  .quiz-header .who { font-weight: 700; color: #075c45; }
  .quiz-header .count { color: #5c7b70; font-size: 14px; }

  .question-card {
    margin-bottom: 16px;
    padding: 18px 18px 14px;
    border-radius: 18px;
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(7,131,95,.14);
    box-shadow: 0 8px 24px rgba(18,78,61,.06);
  }
  .question-title {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 12px;
    font-size: 16px;
    line-height: 1.7;
    font-weight: 700;
    color: #123c31;
  }
  .q-index {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 8px;
    border-radius: 999px;
    background: #e4fff5;
    color: #07835f;
    font-size: 13px;
    font-weight: 800;
  }

  .options { display: grid; gap: 9px; }
  .option-label {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 11px 13px;
    border-radius: 13px;
    border: 1.5px solid #d9efe7;
    background: #fbfffd;
    cursor: pointer;
    transition: .16s;
    line-height: 1.55;
    font-size: 15px;
  }
  .option-label:hover { border-color: #8ed9bf; background: #f2fffa; }
  .option-label input {
    margin-top: 4px;
    accent-color: #08a572;
    flex: 0 0 auto;
  }
  .option-label:has(input:checked) {
    border-color: #08a572;
    background: #e8fff7;
    box-shadow: 0 0 0 3px rgba(8,165,114,.1);
  }

  .submit-bar {
    position: sticky;
    bottom: 0;
    z-index: 3;
    margin-top: 22px;
    padding: 14px;
    border-radius: 18px 18px 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.96));
    backdrop-filter: blur(8px);
    border: 1px solid rgba(7,131,95,.12);
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }
  .submit-bar .btn { min-width: 140px; }

  #resultCapture {
    position: relative;
    overflow: hidden;
    background: #fff;
    border-radius: 20px;
    padding: 26px;
    border: 1px solid rgba(7,131,95,.14);
  }
  .cap-watermark {
    position: absolute;
    left: -35%;
    top: -35%;
    width: 170%;
    height: 170%;
    z-index: 0;
    pointer-events: none;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 55px 85px;
    padding: 30px;
    transform: rotate(-45deg);
    opacity: 0.055;
    color: #07835f;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 2px;
    user-select: none;
    white-space: nowrap;
  }
  .capture-content { position: relative; z-index: 1; }

  .result-card {
    border-radius: 18px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  .result-card.pass {
    background: linear-gradient(135deg, #eafff7, #f5fffb);
    border: 2px solid #72d9b6;
  }
  .result-card.fail {
    background: linear-gradient(135deg, #fff2f2, #fffafa);
    border: 2px solid #f0a7a7;
  }
  .result-card h2 { margin: 0 0 8px; font-size: 30px; }
  .result-card.pass h2 { color: #07835f; }
  .result-card.fail h2 { color: #c83e3e; }
  .result-card .nick { color: #3f665a; font-size: 16px; margin: 6px 0; }
  .result-card .score {
    font-size: 42px;
    font-weight: 900;
    margin: 12px 0 4px;
    letter-spacing: 1px;
  }
  .result-card.pass .score { color: #08a572; }
  .result-card.fail .score { color: #d13f3f; }
  .result-card .sub { color: #6b857d; font-size: 14px; line-height: 1.8; }

  .wrong-title {
    margin: 10px 0 14px;
    color: #8f3030;
    font-size: 20px;
    font-weight: 800;
    text-align: center;
  }
  .wrong-title.pass-title { color: #2a6f5b; }
  .wrong-item {
    margin-bottom: 14px;
    padding: 16px;
    border-radius: 16px;
    background: #fffafa;
    border: 1px solid #f2c7c7;
  }
  .wrong-item.pass-item {
    background: #f8fffc;
    border-color: #bfe8da;
  }
  .wrong-question {
    font-weight: 800;
    line-height: 1.65;
    color: #4a2222;
    margin-bottom: 10px;
  }
  .wrong-item.pass-item .wrong-question { color: #245c4a; }
  .wrong-options { display: grid; gap: 8px; }
  .wrong-option {
    padding: 9px 11px;
    border-radius: 11px;
    border: 1px solid #f0dada;
    background: #fff;
    color: #5b4a4a;
    line-height: 1.55;
    font-size: 14px;
  }
  .wrong-item.pass-item .wrong-option {
    border-color: #d7ece4;
    color: #4c6259;
  }
  .wrong-option.selected {
    border: 2px solid #e05252;
    background: #fff0f0;
    color: #a62d2d;
    font-weight: 700;
  }
  .wrong-item.pass-item .wrong-option.selected {
    border: 2px solid #e08a3c;
    background: #fff7ec;
    color: #8a5a10;
  }
  .your-choice-tag {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    border-radius: 999px;
    background: #e05252;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  .wrong-item.pass-item .your-choice-tag { background: #e08a3c; }

  .result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 18px;
  }

  .footnote {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: #78948b;
    line-height: 1.7;
  }

  @media (max-width: 620px) {
    .app { width: min(100% - 18px, 980px); padding-top: 16px; }
    .card { padding: 18px; border-radius: 16px; }
    .question-card { padding: 15px; }
    .submit-bar { justify-content: stretch; }
    .submit-bar .btn { flex: 1; min-width: 0; }
    .result-card h2 { font-size: 25px; }
    .result-card .score { font-size: 36px; }
  }
</style>
</head>
<body>
  <div class="watermark" id="watermark" aria-hidden="true"></div>

  <main class="app">
    <div class="brand">
      <h1>新手保护协会 · 入会申请面试</h1>
      <p>请认真作答，提交后自动评分。满分 100 分，60 分及以上合格。</p>
    </div>

    <section id="startScreen" class="card start-box">
      <h2>填写答题者游戏昵称</h2>
      <p class="tip">
        每次开始会抽取 20 道题，题目顺序与选项顺序每次都会随机打乱。
      </p>
      <input id="nicknameInput" class="nickname-input" type="text" maxlength="20" placeholder="请输入游戏昵称" autocomplete="off" />
      <button id="startBtn" class="btn btn-primary" onclick="startQuiz()">开始答题</button>
    </section>

    <section id="quizScreen" class="hidden">
      <div class="quiz-header">
        <div class="who">答题者：<span id="quizNickname"></span></div>
        <div class="count" id="quizCount"></div>
      </div>
      <form id="quizForm" onsubmit="submitQuiz(event)">
        <div id="questionList"></div>
        <div class="submit-bar">
          <button type="button" class="btn btn-secondary" onclick="if(confirm('确定要重新开始吗？当前答题内容会丢失。')) restartQuiz();">重新开始</button>
          <button type="submit" id="submitBtn" class="btn btn-primary">提交答卷</button>
        </div>
      </form>
      <div class="footnote">水印：新手保护协会 · 入会申请面试</div>
    </section>

    <section id="resultScreen" class="hidden">
      <div id="resultCapture">
        <div class="cap-watermark" id="capWatermark" aria-hidden="true"></div>
        <div class="capture-content" id="captureContent"></div>
      </div>
      <div class="result-actions">
        <button id="captureBtn" class="btn btn-primary" onclick="captureResult()">一键截图</button>
        <button class="btn btn-secondary" onclick="restartQuiz()">重新答题</button>
      </div>
      <div class="footnote">
        截图会保存为 PNG 图片。若截图无反应，请确认网络可加载 html2canvas。
      </div>
    </section>
  </main>

<script>
/* =========================================================
   题库数据（已按最新题库更新）
   - 必出 15 题 + 随机池 7 题（每次抽 5 题）= 20 题
   - opts 已在源码中打乱存储，正确答案位置不固定
   - enc 仅用于初始化时定位正确选项文本
   - 判分走选项文本的迭代 SHA-256 比对
   ========================================================= */
const BANK = [
  // ============ 必出 15 题 ============
  { id: 1, type: "required",
    q: "打远征时，大家俗称的“下绿包”，具体是指什么？",
    opts: [
      "天上会下绿色手提包雨",
      "取消装备<宠物自动拾取道具>功能",
      "下载一个叫做“绿包”的辅助软件，帮忙抢掉落物",
      "地图靠下的位置有一个绿色的包裹，里面会出极品道具"
    ], enc: 73 },
  { id: 2, type: "required",
    q: "远征Boss爆卡通常是如何分配的？",
    opts: [
      "所有人拼手速谁捡到就是谁的",
      "不能手动捡取，只能上绿包看谁的宠物跑得快",
      "副本中的人有序地站成一排，卡片掉的离谁最近就由谁来捡卡",
      "主力队成员在<对所有人>频道中输入\"@roll\"进行随机点数PK，由团长判断并点名roll点数由高到低的玩家依次捡卡"
    ], enc: 122 },
  { id: 3, type: "required",
    q: "远征中下线后，多少时间内再上线能重连回远征中？",
    opts: ["30秒", "无限", "10分钟", "1分钟"], enc: 112 },
  { id: 4, type: "required",
    q: "远征重连有没有次数限制？没死亡和死亡后分别能重连几次？（狮子王除外）",
    opts: [
      "没死亡和死亡重连都只有1次",
      "没死亡只有1次、死亡重连无限次",
      "没死亡连无限次、死亡重连只有1次",
      "没死亡和死亡重连都是无限次"
    ], enc: 111 },
  { id: 5, type: "required",
    q: "本群的远征要如何报名？",
    opts: ["在群里刷屏喊求组", "私聊找管理索要报名表", "守着群聊消息等别人发布", "在群公告置顶有报名表"], enc: 27 },
  { id: 6, type: "required",
    q: "我们群的“一条远征”规则中，填表的主力队队员迟到多少分钟视为迟到？",
    opts: ["1天", "10分钟", "没有时间限制", "1秒钟"], enc: 16 },
  { id: 7, type: "required",
    q: "新手保护协会 和 新手保护组织 目前每周的会费是多少金币？",
    opts: ["1000万", "21亿4748万3647", "200", "20万"], enc: 13 },
  { id: 8, type: "required",
    q: "哪两个职业是不需要在两个新手保护家族交会费的？",
    opts: ["鬼剑士、神枪手", "冰雷、刀飞", "冲锋队长、圣骑士", "铁匠、车头"], enc: 59 },
  { id: 9, type: "required",
    q: "在<对所有人>中输入什么可以查看当前地图的归属人？",
    opts: ["@老A", "无法查看", "@巡查", "@归属"], enc: 55 },
  { id: 10, type: "required",
    q: "地图归属是什么意思？",
    opts: [
      "某人找老A买断了这张地图的所有权，想在这张图打怪必须找老A用更高的价格买下地图归属",
      "只有角色名中带有\"属\"字的人才能在这张地图中刷怪",
      "纯属玩家捏造的概念，服务器没有地图归属这种说法",
      "当前地图因为某人先来打怪了，所以地图暂时归他所有，除了他和他的队友以外其他人不能在这里抢怪"
    ], enc: 34 },
  { id: 11, type: "required",
    q: "遇到有人无视归属抢怪，以下做法正确的是什么？",
    opts: [
      "亲切问候他的家人",
      "先礼貌劝离，劝离无效的话，点商城上面的举报按钮举报，等巡查来处理他",
      "马上发\"?\"以及阴阳怪气嘲讽他，把他逼走",
      "截图发到KOOK举报区然后生闷气"
    ], enc: 219 },
  { id: 12, type: "required",
    q: "远征中的“奶扫地”是什么意思？",
    opts: [
      "奶妈要及时扫干净地板上刀飞“敛财术”爆出来的金币，这是奶妈在远征中的主要责任",
      "用道具“牛奶”铺满整个地面，作为贡品提高Boss掉落率，是大家约定俗成祈求丰收的一种仪式",
      "队伍中有奶妈的情况下，远征打完了让奶妈捡取除了怪物卡以外的所有Boss掉落物",
      "奶妈使用道具“扫帚”在远征开始前先把地面扫一遍，防止Boss使用推人技能的时候有玩家滑倒"
    ], enc: 215 },
  { id: 13, type: "required",
    q: "在游戏中遇到有路人骂你时，怎样正确应对？",
    opts: [
      "做一个没有感情的复读机，他骂啥就骂回去，不要忘记问候他的老妈",
      "刷紫喇叭刷屏骂他，绝不能落了下风，紫喇叭肯定是对的，并准备随时线下真实他",
      "理性回复，不和他对骂，截图保留他骂人的相关证据发在KOOK举报区",
      "马上下线躲在被窝里偷偷抹眼泪"
    ], enc: 194 },
  { id: 14, type: "required",
    q: "“单挂”是什么意思？",
    opts: [
      "单纯进来体验一下挂掉是什么感觉",
      "在远征中不进入主力队伍输出，而是单纯在一旁挂机，并通过下上线重连的方式规避伤害，主要目的是获得护肩经验或道具。",
      "单依纯挂名赞助本场远征，是单依纯粉丝的应援广告行为",
      "简单的挂在绳子上的意思"
    ], enc: 248 },
  { id: 15, type: "required",
    q: "现在哪些图、线（频道）是无归属的？",
    opts: [
      "19-24线、Boss地图、以及个别场景过大的地图",
      "23-28线、彩虹村地图、以及个别场景过大的地图",
      "23-28线、Boss地图、以及个别场景过大的地图",
      "19-24线、彩虹村地图、以及个别场景过大的地图"
    ], enc: 244 },

  // ============ 随机池 7 题，每次抽 5 题 ============
  { id: 16, type: "random",
    q: "哪2个远征Boss会掉落用来增加血量上限的洗血圣杯？",
    opts: ["红蜗牛王、蘑菇王", "九尾狐、大脚怪", "扎昆、黑龙", "伊利丹、死亡之翼"], enc: 227 },
  { id: 17, type: "random",
    q: "JJB指的是什么远征BOSS？",
    opts: ["救酱爆", "进阶巴洛克", "猪猪侠", "鸡鸡爆"], enc: 153 },
  { id: 18, type: "random",
    q: "玩家俗称“猪闹”指的是什么？",
    opts: [
      "野猪很闹腾",
      "灌水区的猪头诈骗事件很闹心",
      "某个叫猪猪的玩家闹事",
      "查乌（野猪）、帕普拉图斯（闹钟）这两个远征Boss"
    ], enc: 138 },
  { id: 19, type: "random",
    q: "目前进入新手线（频道）的等级要求是小于等于多少级？",
    opts: ["30", "220", "10", "140"], enc: 129 },
  { id: 20, type: "random",
    q: "新手线（频道）的特殊福利是什么？",
    opts: [
      "经验双倍、爆率双倍",
      "刷怪更快更满、怪物卡爆率+100%、护肩经验+100%",
      "可以随便开飞天外挂",
      "没有归属"
    ], enc: 190 },
  { id: 21, type: "random",
    q: "在<对所有人>中输入什么可以屏蔽掉喇叭和抽奖？",
    opts: ["@屏蔽抽奖", "@屏蔽", "@屏蔽抽奖和喇叭", "@屏蔽喇叭"], enc: 171 },
  { id: 22, type: "random",
    q: "使用什么指令可以查询当前游戏角色各个远征的剩余挑战次数？",
    opts: ["@远征次数查询", "@查询", "@boss查询", "@百度"], enc: 161 }
];

/* =========================
   全局状态
   ========================= */
const state = {
  nickname: "",
  questions: [],
  answers: {},
  results: []
};

/* =========================================================
   Hash 层
   ========================================================= */
const PEPPER = "XinShouBaoHu_2024#_v3_pepper";
const HASH_ITERATIONS = 50;
const CORRECT_HASHES = Object.create(null);
let HASH_READY = false;
let HASH_INIT_PROMISE = null;

function simpleHashHex(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, "0") +
         (h1 >>> 0).toString(16).padStart(8, "0");
}

async function sha256Hex(str) {
  if (window.crypto && window.crypto.subtle) {
    const buf = new TextEncoder().encode(str);
    const digest = await window.crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(digest))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }
  return simpleHashHex(str);
}

async function iterHash(str) {
  let h = str;
  for (let i = 0; i < HASH_ITERATIONS; i++) {
    h = await sha256Hex(h + "|" + PEPPER + "|" + i);
  }
  return h;
}

function makeSalt(qid) {
  return "s" + qid + "_" + ((qid * 2654435761) % 1000003) + "_" + PEPPER.slice(0, 6);
}

function decryptAnswer(enc, qid) {
  const idx = ((enc ^ 0x5A) - qid * 11 - 7);
  return Number.isInteger(idx) ? idx : 0;
}

async function initCorrectHashes() {
  if (HASH_READY) return;
  for (const q of BANK) {
    const correctIndex = decryptAnswer(q.enc, q.id);
    const correctText = q.opts[correctIndex];
    const salt = makeSalt(q.id);
    CORRECT_HASHES[q.id] = await iterHash(`${correctText}|${salt}|${q.id}`);
  }
  HASH_READY = true;
}

function ensureHashesReady() {
  if (!HASH_INIT_PROMISE) HASH_INIT_PROMISE = initCorrectHashes();
  return HASH_INIT_PROMISE;
}

async function checkAnswerByText(qid, selectedText) {
  if (!HASH_READY) await ensureHashesReady();
  const salt = makeSalt(qid);
  const userHash = await iterHash(`${selectedText}|${salt}|${qid}`);
  return userHash === CORRECT_HASHES[qid];
}

/* =========================
   通用工具
   ========================= */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function (m) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[m];
  });
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fillWatermark(container) {
  if (!container) return;
  container.innerHTML = "";
  for (let i = 0; i < 180; i++) {
    const span = document.createElement("span");
    span.textContent = "新手保护协会 · 入会申请面试";
    container.appendChild(span);
  }
}

/* =========================
   抽题 & 生成题目实例
   ========================= */
function buildQuestions() {
  const required = BANK.filter(q => q.type === "required");
  const randomPool = BANK.filter(q => q.type === "random");
  const pickedRandom = shuffle(randomPool).slice(0, 5);
  const combined = shuffle([...required, ...pickedRandom]);

  return combined.map(q => {
    const correctIndex = decryptAnswer(q.enc, q.id);

    const arr = q.opts.map((text, idx) => ({
      text,
      isCorrect: idx === correctIndex
    }));
    const shuffledArr = shuffle(arr);

    return {
      ...q,
      displayOpts: shuffledArr.map(x => x.text),
      correctIdx: shuffledArr.findIndex(x => x.isCorrect)
    };
  });
}

/* =========================
   开始答题
   ========================= */
async function startQuiz() {
  const input = document.getElementById("nicknameInput");
  const startBtn = document.getElementById("startBtn");
  const nickname = input.value.trim();

  if (!nickname) {
    alert("请先输入你的游戏昵称。");
    input.focus();
    return;
  }
  if (nickname.length > 20) {
    alert("昵称太长了，请控制在 20 个字符以内。");
    return;
  }

  if (!HASH_READY) {
    const oldText = startBtn.textContent;
    startBtn.disabled = true;
    startBtn.textContent = "正在初始化…";
    try {
      await ensureHashesReady();
    } catch (e) {
      console.error(e);
      alert("初始化失败，请刷新页面重试。");
      startBtn.disabled = false;
      startBtn.textContent = oldText;
      return;
    }
    startBtn.disabled = false;
    startBtn.textContent = oldText;
  }

  state.nickname = nickname;
  state.answers = {};
  state.results = [];
  state.questions = buildQuestions();

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  document.getElementById("resultScreen").classList.add("hidden");

  document.getElementById("quizNickname").textContent = state.nickname;
  document.getElementById("quizCount").textContent =
    `共 ${state.questions.length} 题，每题约 ${(100 / state.questions.length).toFixed(2)} 分`;

  renderQuestions();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =========================
   重新答题（保留昵称，重新抽题+打乱）
   ========================= */
function restartQuiz() {
  if (!state.nickname) {
    location.reload();
    return;
  }

  state.answers = {};
  state.results = [];
  state.questions = buildQuestions();

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  document.getElementById("resultScreen").classList.add("hidden");

  document.getElementById("quizNickname").textContent = state.nickname;
  document.getElementById("quizCount").textContent =
    `共 ${state.questions.length} 题，每题约 ${(100 / state.questions.length).toFixed(2)} 分`;

  renderQuestions();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =========================
   渲染题目
   ========================= */
function renderQuestions() {
  const list = document.getElementById("questionList");
  list.innerHTML = "";

  state.questions.forEach((q, index) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.dataset.qid = q.id;

    let optionsHtml = "";
    q.displayOpts.forEach((opt, optIndex) => {
      const inputId = `q_${q.id}_${optIndex}`;
      optionsHtml += `
        <label class="option-label" for="${inputId}">
          <input type="radio" id="${inputId}" name="q_${q.id}" value="${optIndex}" />
          <span>${escapeHtml(opt)}</span>
        </label>
      `;
    });

    card.innerHTML = `
      <div class="question-title">
        <span class="q-index">${index + 1}</span>
        <span>${escapeHtml(q.q)}</span>
      </div>
      <div class="options">${optionsHtml}</div>
    `;

    list.appendChild(card);
  });
}

/* =========================
   提交答卷（hash 判分）
   ========================= */
async function submitQuiz(event) {
  event.preventDefault();
  const submitBtn = document.getElementById("submitBtn");

  const answers = {};
  let firstUnanswered = null;

  for (const q of state.questions) {
    const checked = document.querySelector(`input[name="q_${q.id}"]:checked`);
    if (!checked) {
      if (!firstUnanswered) firstUnanswered = q.id;
      continue;
    }
    answers[q.id] = Number(checked.value);
  }

  if (firstUnanswered) {
    alert("还有题目没有作答，请完成所有题目后再提交。");
    const target = document.querySelector(`.question-card[data-qid="${firstUnanswered}"]`);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  state.answers = answers;

  const oldText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = "正在判分…";

  try {
    await ensureHashesReady();

    let correctCount = 0;
    const results = [];
    for (const q of state.questions) {
      const selectedIndex = state.answers[q.id];
      const selectedText = q.displayOpts[selectedIndex];
      const ok = await checkAnswerByText(q.id, selectedText);
      if (ok) correctCount++;
      results.push({ qid: q.id, ok });
    }

    const score = (correctCount * 100) / state.questions.length;
    const scoreText = score.toFixed(2);
    const pass = score >= 60 - 1e-9;

    state.results = results;
    renderResult(correctCount, scoreText, pass, results);

    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    console.error(e);
    alert("判分失败，请重试。");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = oldText;
  }
}

/* =========================
   渲染错题（合格/不合格都用到）
   ========================= */
function buildWrongListHtml(pass, results) {
  const resultMap = new Map(results.map(r => [r.qid, r.ok]));
  const wrongQuestions = state.questions.filter(q => !resultMap.get(q.id));

  if (wrongQuestions.length === 0) {
    return `<div class="wrong-item ${pass ? "pass-item" : ""}">
      <div class="wrong-question">本次没有答错题。</div>
    </div>`;
  }

  let html = "";
  wrongQuestions.forEach((q, idx) => {
    const userChoice = state.answers[q.id];

    let optionHtml = "";
    q.displayOpts.forEach((opt, optIndex) => {
      const selected = optIndex === userChoice;
      optionHtml += `
        <div class="wrong-option ${selected ? "selected" : ""}">
          ${escapeHtml(opt)}
          ${selected ? '<span class="your-choice-tag">你的选择</span>' : ""}
        </div>
      `;
    });

    html += `
      <div class="wrong-item ${pass ? "pass-item" : ""}">
        <div class="wrong-question">第 ${idx + 1} 道答错题：${escapeHtml(q.q)}</div>
        <div class="wrong-options">${optionHtml}</div>
      </div>
    `;
  });

  return html;
}

/* =========================
   渲染结果
   ========================= */
function renderResult(correctCount, scoreText, pass, results) {
  const content = document.getElementById("captureContent");
  const total = state.questions.length;
  const wrongListHtml = buildWrongListHtml(pass, results);

  if (pass) {
    content.innerHTML = `
      <div class="result-card pass">
        <h2>恭喜合格</h2>
        <div class="nick">答题者：${escapeHtml(state.nickname)}</div>
        <div class="score">${scoreText} 分</div>
        <div class="sub">
          答对 ${correctCount} / ${total} 题<br />
          欢迎加入新手保护协会，期待与你一起冒险。
        </div>
      </div>
      <div class="wrong-title pass-title">答错题目回顾（只显示你的选择）</div>
      ${wrongListHtml}
    `;
  } else {
    content.innerHTML = `
      <div class="result-card fail">
        <h2>很遗憾，未合格</h2>
        <div class="nick">答题者：${escapeHtml(state.nickname)}</div>
        <div class="score">${scoreText} 分</div>
        <div class="sub">
          答对 ${correctCount} / ${total} 题<br />
          合格线为 60 分，请复习下方错题后再来挑战。
        </div>
      </div>
      <div class="wrong-title">错题回顾（只显示你的选择）</div>
      ${wrongListHtml}
    `;
  }
}

/* =========================
   一键截图
   ========================= */
async function captureResult() {
  const btn = document.getElementById("captureBtn");
  const target = document.getElementById("resultCapture");

  if (typeof html2canvas !== "function") {
    alert("截图库尚未加载成功，请检查网络后刷新页面重试。");
    return;
  }

  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = "正在生成截图...";

  try {
    const canvas = await html2canvas(target, {
      backgroundColor: "#ffffff",
      scale: 2,
      useCORS: true,
      logging: false
    });

    const dataUrl = canvas.toDataURL("image/png");
    const a = document.createElement("a");
    const safeNick = state.nickname.replace(/[\\/:*?"<>|]/g, "_") || "答题者";
    const resultName = document.querySelector(".result-card.pass") ? "合格" : "不合格";
    a.download = `新手保护协会_${safeNick}_${resultName}.png`;
    a.href = dataUrl;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (err) {
    console.error(err);
    alert("截图生成失败，请重试。");
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

/* =========================
   初始化
   ========================= */
fillWatermark(document.getElementById("watermark"));
fillWatermark(document.getElementById("capWatermark"));

ensureHashesReady().catch(err => console.error("hash init failed", err));

(function initNicknameInput() {
  const input = document.getElementById("nicknameInput");
  const originalPlaceholder = input.getAttribute("placeholder") || "请输入游戏昵称";

  input.addEventListener("focus", function () {
    input.setAttribute("placeholder", "");
  });
  input.addEventListener("blur", function () {
    if (!input.value.trim()) {
      input.setAttribute("placeholder", originalPlaceholder);
    }
  });
  input.addEventListener("input", function () {
    if (input.value) {
      input.setAttribute("placeholder", "");
    } else if (document.activeElement !== input) {
      input.setAttribute("placeholder", originalPlaceholder);
    }
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      startQuiz();
    }
  });
})();
</script>
