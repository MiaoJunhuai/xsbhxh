    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #f7efdd 0%, #efe2c9 100%);
      color: #4e3e2b;

      padding-top: 60px;
      -webkit-text-size-adjust: 100%;
    }

    /* ===== 导航（与其他页面同一套） ===== */
    .xsb-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 900;
      background: rgba(250, 242, 224, .72);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      backdrop-filter: blur(24px) saturate(1.8);
      border-bottom: 1px solid rgba(110, 94, 62, .28);
    }
    .xsb-nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      height: 60px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .xsb-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: none;
      color: #4e3e2b;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .xsb-badge { display: inline-flex; }
    .xsb-badge img {
      width: 26px; height: 26px;
      display: block;
      image-rendering: pixelated;
      border-radius: 6px;
    }
    .xsb-links { display: flex; align-items: center; gap: 2px; margin-left: auto; }
    .xsb-links a {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      color: #7b6a50;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      transition: color .24s ease, background .24s ease;
    }
    .xsb-links a:hover { color: #4e3e2b; background: rgba(120, 98, 64, .14); }
    .xsb-ico { display: inline-flex; align-items: center; }
    .xsb-ico svg { width: 15px; height: 15px; display: block; }

    .xsb-auth {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      margin-left: 8px;
      height: 26px;
      padding: 0 11px;
      font-size: 12.5px;
      font-weight: 700;
      color: #4e3e2b;
      background: rgba(47, 125, 79, .18);
      border: 1px solid rgba(47, 125, 79, .4);

      text-decoration: none;

    .xsb-auth-ico { display: inline-flex; align-items: center; }
    .xsb-auth-ico svg { width: 15px; height: 15px; display: block; }

    @media (max-width: 760px) {

      display: inline-block;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      vertical-align: bottom;
      transition: max-width .15s ease, opacity .1s ease;
    }
      .xsb-auth { margin-left: 4px; padding: 0 8px; }
      .xsb-auth-txt { display: none; }

    /* ===== 账号卡片 ===== */
    .acct-wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: 34px 16px 60px;
    }
    .acct-card {
      padding: 26px 22px 22px;

    .acct-modes { display: flex; gap: 6px; margin-bottom: 14px; }

      font-family: inherit;
      color: #7b6a50;
      background: transparent;
      border: 1px solid rgba(139, 110, 60, .3);
      border-radius: 999px;
      cursor: pointer;
    }
    .acct-mode.is-active {
      color: #fff8e6;
      background: linear-gradient(145deg, #b8860b, #96690a);
      border-color: transparent;
    }
    .acct-input {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 11px 13px;
      font-size: 14px;
      font-family: inherit;
      color: #4e3b21;
      background: #fff;
      border: 1px solid rgba(139, 110, 60, .35);
      border-radius: 10px;
      outline: none;
    }
    .acct-input[hidden] { display: none; }
    .acct-input:focus {
      border-color: #b8860b;
      box-shadow: 0 0 0 3px rgba(184, 134, 30, .16);
    }
    .acct-msg { min-height: 1.2em; margin-bottom: 10px; font-size: 12.5px; color: #7b6a50; }
    .acct-msg.is-err { color: #b0361e; }
    .acct-msg.is-ok { color: #2f6b46; }
    .acct-submit {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 700;
      color: #fff8e6;
      background: linear-gradient(145deg, #b8860b, #96690a);

      border-radius: 10px;
      cursor: pointer;

    .acct-submit:disabled { opacity: .55; }
    .acct-note {
      margin-top: 14px;
      font-size: 11.5px;
      line-height: 1.6;

    }
    .acct-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;

      padding: 11px 0;
      font-size: 13px;
      color: #8b7a5e;

    .acct-row b { color: #3f3122; font-size: 13.5px; text-align: right; word-break: break-all; }
    .acct-logout {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      font-size: 13.5px;
      font-family: inherit;
      font-weight: 700;
      color: #8a2a17;
      background: rgba(176, 58, 46, .09);
      border: 1px solid rgba(176, 58, 46, .28);
      border-radius: 10px;
      cursor: pointer;
    }
    .acct-rename {
      margin-top: 14px;
      color: #96690a;
      background: rgba(184, 134, 30, .1);
      border-color: rgba(184, 134, 30, .32);
    }
    .acct-nickedit {
      margin-top: 14px;
      padding: 12px;
      background: rgba(139, 110, 60, .07);
      border: 1px dashed rgba(139, 110, 60, .3);
      border-radius: 10px;
    }
    .acct-nickedit[hidden] { display: none; }
    .acct-game {
      margin: 14px 0 4px;
      padding: 10px 12px 4px;
      background: rgba(139, 110, 60, .05);
      border: 1px solid rgba(139, 110, 60, .16);
      border-radius: 10px;
    }
    .acct-game-title {
      font-size: 12px;
      font-weight: 700;
      color: #96690a;
      letter-spacing: .04em;
      margin-bottom: 2px;
    }
    .acct-back {
      margin-top: 20px;
      text-align: center;
      font-size: 12.5px;
    }
    .acct-back a { color: #8b7a5e; text-decoration: none; }
    .acct-back a:hover { color: #4e3e2b; }
    .xsb-links, .nav-links { --pill-bg: rgba(47, 125, 79, .2); }

  /* ===== 导航选中胶囊：单独一个元素在各项之间滑动，不再整块淡入淡出 ===== */
  .nav-pill { display: none; }
  @media (max-width: 760px) {
    .xsb-links, .nav-links { position: relative; }
    .nav-pill {
      display: block;
      position: absolute;
      left: 0; top: 0;
      width: 0; height: 0;
      border-radius: 999px;
      background: var(--pill-bg, rgba(59, 51, 39, .55));
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      transition: left .3s cubic-bezier(.4, 0, .2, 1),
                  width .3s cubic-bezier(.4, 0, .2, 1),
                  top .2s ease, height .2s ease, opacity .16s ease;
    }
    /* 选中项自己不再画底色，交给胶囊 */
    .xsb-links a.is-active, .nav-links a.active { background: transparent !important; }
    .xsb-links a, .nav-links a { z-index: 1; }
  }
</style>

<script>
(function () {
  var LB_URL = 'https://xjyovpninpfztldqoddj.supabase.co';
  var LB_KEY = 'sb_publishable_uDRHXpUMaX9Wa2WJrqefrA_cK27Qqxl';

  var K_TOKEN = 'xsbhxh_token';
  var K_REFRESH = 'xsbhxh_refresh';
  var K_EMAIL = 'xsbhxh_email';
  var K_UID = 'xsbhxh_uid';
  var K_PID = 'xsbhxh_player_id_v1';

  var authToken = '';
  var authRefresh = '';
  var authEmail = '';
  var authUid = '';

  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function loadAuth() {
    authToken = lsGet(K_TOKEN);
    authRefresh = lsGet(K_REFRESH);
    authEmail = lsGet(K_EMAIL);
    authUid = lsGet(K_UID);
  }

  function saveAuth(data) {
    authToken = (data && data.access_token) || '';
    authRefresh = (data && data.refresh_token) || authRefresh;
    authUid = (data && data.user && data.user.id) || authUid;
    authEmail = (data && data.user && data.user.email) || authEmail;
    if (authToken) lsSet(K_TOKEN, authToken);
    if (authRefresh) lsSet(K_REFRESH, authRefresh);
    if (authUid) lsSet(K_UID, authUid);
    if (authEmail) lsSet(K_EMAIL, authEmail);
  }

  function clearAuth() {
    authToken = ''; authRefresh = ''; authEmail = ''; authUid = '';
    lsDel(K_TOKEN); lsDel(K_REFRESH); lsDel(K_EMAIL); lsDel(K_UID);
  }

  function makeUuid() {
    if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    var b = new Uint8Array(16);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
    else for (var i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    var h = Array.from(b, function (x) { return x.toString(16).padStart(2, '0'); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }

  function getPlayerId() {
    var id = lsGet(K_PID);
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
      id = makeUuid();
      lsSet(K_PID, id);
    }
    return id;
  }

  function headers() {
    var h = { 'apikey': LB_KEY, 'Content-Type': 'application/json' };
    if (authToken) h['Authorization'] = 'Bearer ' + authToken;
    return h;
  }

  function postJson(path, body) {
    return fetch(LB_URL + path, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify(body)
    });
  }

  function authRequest(path, body) {
    return fetch(LB_URL + path, {
      method: 'POST',
      headers: { 'apikey': LB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (txt) {
        var data = {};
        try { data = JSON.parse(txt); } catch (e) {}
        if (!res.ok) {
          var m = data.msg || data.error_description || data.message || ('HTTP ' + res.status);
          throw new Error(m);
        }
        return data;
      });
    });
  }

  function claimRecords() {
    if (!authToken) return Promise.resolve(0);
    return postJson('/rest/v1/rpc/claim_my_records', { p_player: getPlayerId() })
      .then(function (res) {
        if (!res.ok) {
          // 以前失败静默吞掉，导致「登录了却没合并」很难发现
          return res.text().then(function (t) {
            try { console.warn('[账号] 认领旧成绩失败:', res.status, t); } catch (e) {}
            return 0;
          });
        }
        return res.json();
      })
      .catch(function () { return 0; });
  }

  function fetchMyScores() {
    return postJson('/rest/v1/rpc/my_scores', { p_player: getPlayerId() })
      .then(function (res) { return res.ok ? res.json() : []; })
      .catch(function () { return []; });
  }

  var msgEl = document.getElementById('acctMsg');
  var emailEl = document.getElementById('acctEmail');
  var email2El = document.getElementById('acctEmail2');
  var passEl = document.getElementById('acctPass');
  var nickEl = document.getElementById('acctNick');
  var submitEl = document.getElementById('acctSubmit');
  var guestView = document.getElementById('viewGuest');
  var userView = document.getElementById('viewUser');
  var whoEl = document.getElementById('acctWho');
  var totalEl = document.getElementById('acctTotal');
  var bestEl = document.getElementById('acctBest');
  var rateEl = document.getElementById('acctRate');
  var claimEl = document.getElementById('acctClaim');
  var nickViewEl = document.getElementById('acctNickView');
  var nickEditEl = document.getElementById('acctNickEdit');
  var nickNewEl = document.getElementById('acctNickNew');
  var nickMsgEl = document.getElementById('acctNickMsg');
  var nickSaveEl = document.getElementById('acctNickSave');
  var renameBtn = document.getElementById('acctRenameBtn');
  var profile = null;
  var mode = 'login';

  function setMsg(text, cls) {
    if (!msgEl) return;
    msgEl.textContent = text || '';
    msgEl.className = 'acct-msg' + (cls ? ' ' + cls : '');
  }

  function setMode(m) {
    mode = m;
    var btns = document.querySelectorAll('.acct-mode');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('is-active', btns[i].getAttribute('data-mode') === m);
    }
    if (email2El) email2El.hidden = m !== 'signup';
    if (nickEl) nickEl.hidden = m !== 'signup';
    if (submitEl) submitEl.textContent = m === 'signup' ? '注册' : '登录';
    setMsg('');
  }

  function loadProfile() {
    if (!authToken) return Promise.resolve(null);
    return postJson('/rest/v1/rpc/my_profile', {})
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (rows) {
        profile = (Array.isArray(rows) && rows.length) ? rows[0] : null;
        return profile;
      })
      .catch(function () { return null; });
  }

  function paintProfile() {
    if (!nickViewEl) return;
    nickViewEl.textContent = (profile && profile.nickname) ? profile.nickname : '还没设置';
    // 把昵称同步到本地，游戏页会直接读它当默认昵称
    if (profile && profile.nickname) {
      try { localStorage.setItem('xsbhxh_nickname', profile.nickname); } catch (e) {}
    }
  }

  function loadStats() {
    if (!authToken) return;
    postJson('/rest/v1/rpc/my_game_stats', {})
      .then(function (res) { return res.ok ? res.json() : []; })
      .then(function (rows) {
        var g = (rows && rows.length) ? rows[0] : null;
        if (!g) {
          if (totalEl) totalEl.textContent = '—';
          if (bestEl) bestEl.textContent = '—';
          if (rateEl) rateEl.textContent = '还没有完成的对局';
          return;
        }
        var games = Number(g.games) || 0;
        var wins = Number(g.wins) || 0;
        var losses = Number(g.losses) || 0;
        if (totalEl) totalEl.textContent = Number(g.total_score || 0).toLocaleString('en-US') + ' 分';
        if (bestEl) bestEl.textContent = games ? (Number(g.best_score || 0) + ' 分') : '—';
        if (rateEl) {
          rateEl.textContent = games
            ? (Math.round(100 * wins / games) + '%（' + wins + ' 胜 / ' + losses + ' 负）')
            : '还没有完成的对局';
        }
      })
      .catch(function () {});
  }

  function render() {
    if (authEmail) {
      guestView.hidden = true;
      userView.hidden = false;
      whoEl.textContent = authEmail;
      claimEl.textContent = '已登录';
      loadProfile().then(paintProfile);
      loadStats();
    } else {
      guestView.hidden = false;
      userView.hidden = true;
    }
  }

  var modes = document.querySelectorAll('.acct-mode');
  for (var i = 0; i < modes.length; i++) {
    modes[i].addEventListener('click', function () { setMode(this.getAttribute('data-mode')); });
  }

  submitEl.addEventListener('click', function () {
    setMsg('');
    var email = (emailEl.value || '').trim();
    var pass = passEl.value || '';
    var nick = (nickEl && nickEl.value ? nickEl.value : '').trim();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg('邮箱格式不对', 'is-err'); return; }
    if (mode === 'signup' && (email2El.value || '').trim() !== email) {
      setMsg('两次输入的邮箱不一致', 'is-err'); return;
    }
    if (pass.length < 6) { setMsg('密码至少 6 位', 'is-err'); return; }
    if (mode === 'signup') {
      if (!nick) { setMsg('请填一个昵称，它会显示在排行榜上', 'is-err'); return; }
      if (Array.from(nick).length > 12) { setMsg('昵称最多 12 个字', 'is-err'); return; }
    }

    submitEl.disabled = true;
    submitEl.textContent = '处理中…';

    var req = mode === 'signup'
      ? authRequest('/auth/v1/signup', { email: email, password: pass })
      : authRequest('/auth/v1/token?grant_type=password', { email: email, password: pass });

    req.then(function (data) {
      if (!data.access_token) throw new Error('这个邮箱可能已经注册过了，切到「登录」再试');
      saveAuth(data);
      // 注册时把昵称写进 profiles；登录的话如果还没有资料也顺手补一个
      var ensure = mode === 'signup'
        ? postJson('/rest/v1/rpc/create_profile', { p_nick: nick }).then(function () {}, function () {})
        : loadProfile().then(function (p) {
            if (!p) return postJson('/rest/v1/rpc/create_profile', { p_nick: '无名贤者' }).then(function () {}, function () {});
          });
      setMsg('已登录，正在合并这台设备上的成绩…', 'is-ok');
      return ensure.then(function () { return claimRecords(); }).then(function (n) {
        render();
        setMsg(mode === 'signup' ? '注册成功' : ('登录成功' + (n > 0 ? '，合并了 ' + n + ' 条成绩' : '')), 'is-ok');
      });
    }).catch(function (e) {
      setMsg(e.message || '操作失败', 'is-err');
    }).then(function () {
      submitEl.disabled = false;
      submitEl.textContent = mode === 'signup' ? '注册' : '登录';
    });
  });

  if (renameBtn) {
    renameBtn.addEventListener('click', function () {
      nickEditEl.hidden = !nickEditEl.hidden;
      if (!nickEditEl.hidden && nickNewEl) {
        nickNewEl.value = (profile && profile.nickname) || '';
        nickNewEl.focus();
      }
    });
  }

  if (nickSaveEl) {
    nickSaveEl.addEventListener('click', function () {
      var v = (nickNewEl.value || '').trim();
      if (nickMsgEl) { nickMsgEl.textContent = ''; nickMsgEl.className = 'acct-msg'; }
      if (!v) { if (nickMsgEl) { nickMsgEl.textContent = '昵称不能为空'; nickMsgEl.className = 'acct-msg is-err'; } return; }
      if (Array.from(v).length > 12) { if (nickMsgEl) { nickMsgEl.textContent = '昵称最多 12 个字'; nickMsgEl.className = 'acct-msg is-err'; } return; }
      nickSaveEl.disabled = true;
      nickSaveEl.textContent = '保存中…';
      postJson('/rest/v1/rpc/change_nickname', { p_nick: v })
        .then(function (res) {
          return res.text().then(function (t) {
            if (!res.ok) {
              var m = '';
              try { m = (JSON.parse(t) || {}).message || ''; } catch (e) {}
              throw new Error(m || '修改失败');
            }
            return JSON.parse(t);
          });
        })
        .then(function (nextAt) {
          return loadProfile().then(function () {
            paintProfile();
            if (nickMsgEl) {
              var d = new Date(nextAt);
              nickMsgEl.textContent = '改好了，下次可改：' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
              nickMsgEl.className = 'acct-msg is-ok';
            }
          });
        })
        .catch(function (e) {
          if (nickMsgEl) { nickMsgEl.textContent = e.message || '修改失败'; nickMsgEl.className = 'acct-msg is-err'; }
        })
        .then(function () {
          nickSaveEl.disabled = false;
          nickSaveEl.textContent = '保存昵称';
        });
    });
  }

  document.getElementById('acctLogout').addEventListener('click', function () {
    clearAuth();
    emailEl.value = '';
    passEl.value = '';
    email2El.value = '';
    setMode('login');
    render();
  });

  document.querySelectorAll('.xsb-links a, .xsb-auth').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (a.getAttribute('href') === '#') e.preventDefault();
    });
  });

  loadAuth();
  render();
  getPlayerId();
})();
</script>

<!-- 让选中的胶囊滑动到当前项（移动端） -->
<script>
(function () {
  function init() {
    var nav = document.querySelector('.xsb-links, .nav-links');
    if (!nav) return;
    var pill = nav.querySelector('.nav-pill');
    if (!pill) return;
    var raf = 0;
    var hadActive = false;   // 上一次绘制时有没有选中项

    function place() {
      raf = 0;
      var active = nav.querySelector('a.is-active, a.active');

      // 没有选中项（比如首页停在最顶上）：把胶囊收起来，并记住「这次是从无到有」
      if (!active) {
        pill.style.opacity = '0';
        pill.style.width = '0px';
        hadActive = false;
        return;
      }

      var nr = nav.getBoundingClientRect();
      var ar = active.getBoundingClientRect();

      // 文字可能还在 max-width 过渡中；用 scrollWidth 补出它最终要占的宽度
      var txt = active.querySelector('.xsb-txt, .nav-txt');
      var extra = 0;
      if (txt) {
        var tr = txt.getBoundingClientRect();
        extra = Math.max(0, txt.scrollWidth - tr.width);
      }

      // 旧选中项正在把文字收回去，它变窄会让右边的项整体左移。
      // 只统计位于目标左侧的那些（右边的不影响目标位置）
      var shift = 0;
      var items = nav.querySelectorAll('a');
      for (var i = 0; i < items.length; i++) {
        var a = items[i];
        if (a === active) continue;
        var t2 = a.querySelector('.xsb-txt, .nav-txt');
        if (!t2) continue;
        var r2 = a.getBoundingClientRect();
        if (r2.left >= ar.left) continue;
        shift += t2.getBoundingClientRect().width;
      }

      var targetLeft = (ar.left - nr.left - shift) + 'px';

      // 「从无到有」的那一次：先瞬移到目标位置（不做 left 过渡），
      // 再把宽度从 0 展开。看起来就是原地从图标里长出来，而不是从旁边横着滑过来。
      if (!hadActive) {
        pill.style.transition = 'none';
        pill.style.left = targetLeft;
        pill.style.top = (ar.top - nr.top) + 'px';
        pill.style.height = ar.height + 'px';
        pill.style.width = '0px';
        void pill.offsetWidth;
        pill.style.transition = '';
        hadActive = true;
      }

      pill.style.opacity = '1';
      pill.style.left = targetLeft;
      pill.style.top = (ar.top - nr.top) + 'px';
      pill.style.width = (ar.width + extra) + 'px';
      pill.style.height = ar.height + 'px';
    }

    function schedule() {
      if (!raf) raf = requestAnimationFrame(place);
      // 过渡走完、布局稳定后再对一次，防止量到中间态
      setTimeout(place, 420);
    }

    place();
    setTimeout(place, 220);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
    window.addEventListener('resize', schedule);
    window.addEventListener('orientationchange', schedule);

    var obs = new MutationObserver(schedule);
    Array.prototype.forEach.call(nav.querySelectorAll('a'), function (a) {
      obs.observe(a, { attributes: true, attributeFilter: ['class'] });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
