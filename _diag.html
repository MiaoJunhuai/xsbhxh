<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0}iframe{width:1440px;height:900px;border:0;display:block}</style>
</head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    try {
      var w = document.getElementById('f').contentWindow;
      var d = w.document;
      var ids = ['apply', 'tools', 'rules', 'about'];
      var res = { winH: w.innerHeight, docH: d.documentElement.scrollHeight, secs: [], report: [] };
      ids.forEach(function (id) {
        var el = d.getElementById(id);
        var r = el.getBoundingClientRect();
        res.secs.push({ id: id, top: Math.round(r.top + w.pageYOffset), h: Math.round(r.height) });
      });
      for (var y = 0; y <= res.docH - res.winH; y += 40) {
        w.scrollTo(0, y);
        var cur = null;
        ids.forEach(function (id) {
          if (d.getElementById(id).getBoundingClientRect().top <= 100) cur = id;
        });
        if (w.innerHeight + w.pageYOffset >= d.documentElement.scrollHeight - 4) cur = 'about';
        res.report.push(y + ':' + cur);
      }
      document.title = 'DIAG|' + JSON.stringify(res);
    } catch (e) { document.title = 'DIAG_ERR|' + e.message; }
  }, 900);
});
</script>
</body></html>
